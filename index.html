<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Birthday Card for Mohit</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to top right, #ffecd2, #fcb69f);
      font-family: 'Comic Sans MS', cursive;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .card {
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      position: relative;
      z-index: 1;
    }

    .card h1 {
      font-size: 36px;
      background: linear-gradient(to right, #ff416c, #ff4b2b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulse 2s infinite;
    }

    .surprise {
      display: none;
      margin-top: 20px;
      font-size: 20px;
      color: #2c3e50;
      animation: fadeIn 1s ease-in-out;
    }

    button {
      padding: 12px 24px;
      margin-top: 20px;
      font-size: 16px;
      background-color: #ff6f61;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #e85c50;
    }

    .balloons {
      position: absolute;
      bottom: -100px;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .balloon {
      position: absolute;
      font-size: 40px;
      animation: float 6s linear infinite;
    }

    .balloon:nth-child(1) { left: 10%; animation-delay: 0s; }
    .balloon:nth-child(2) { left: 30%; animation-delay: 2s; }
    .balloon:nth-child(3) { left: 50%; animation-delay: 1s; }
    .balloon:nth-child(4) { left: 70%; animation-delay: 3s; }
    .balloon:nth-child(5) { left: 90%; animation-delay: 1.5s; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }

    @keyframes float {
      0% { bottom: -100px; opacity: 0; }
      50% { opacity: 1; }
      100% { bottom: 110%; opacity: 0; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="balloons">
    <div class="balloon">🎈</div>
    <div class="balloon">🎈</div>
    <div class="balloon">🎈</div>
    <div class="balloon">🎈</div>
    <div class="balloon">🎈</div>
  </div>

  <div class="card">
    <h1>Happy Birthday, Mohit! 🎂</h1>
    <button onclick="showSurprise()">Click for Surprise</button>
    <div class="surprise" id="surprise">
      🎉 Wishing you all the happiness in the world! <br>
      May your year be filled with love, laughter, and success! 💖🥳
    </div>
  </div>

  <script>
    function showSurprise() {
      document.getElementById('surprise').style.display = 'block';
    }
  </script>

</body>
</html>
